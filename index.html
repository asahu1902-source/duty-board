<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Daily Operator Duty Lineup</title>
  
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#07142b">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #07142b;
      overflow: hidden;
    }

    /* SPLASH SCREEN MATCHING YOUR LOGO BACKGROUND */
    #splashScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #07142b;
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease-out;
      pointer-events: none;
    }

    .splash-logo-container {
      position: relative;
      width: 150px;
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 25px;
    }

    /* Rotating Neon Border Ring */
    .splash-pulse-ring {
      position: absolute;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: 3.5px dashed #facc15;
      animation: spinRing 3s linear infinite;
    }

    /* Rounded App Icon */
    .splash-app-icon {
      width: 115px;
      height: 115px;
      border-radius: 50%;
      object-fit: cover;
      border: 3.5px solid #ef4444;
      box-shadow: 0 0 35px rgba(239, 68, 68, 0.45);
      z-index: 2;
      background: #07142b;
    }

    /* Synchronizing Text with Glowing Cyan */
    .splash-load-text {
      color: #00ffff;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      animation: textPulse 1s ease-in-out infinite alternate;
    }

    @keyframes spinRing {
      100% { transform: rotate(360deg); }
    }

    @keyframes textPulse {
      0%   { opacity: 0.5; transform: scale(0.98); }
      100% { opacity: 1; transform: scale(1.02); text-shadow: 0 0 14px rgba(0, 255, 255, 0.9); }
    }

    /* Live Duty Board Frame */
    #dutyFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background-color: #000000;
    }
  </style>
</head>
<body>

  <!-- App Icon Splash Screen -->
  <div id="splashScreen">
    <div class="splash-logo-container">
      <div class="splash-pulse-ring"></div>
      <img src="icon.png" alt="App Icon" class="splash-app-icon" onerror="this.src='https://asahu1902-source.github.io/duty-board/icon.png'">
    </div>
    <div class="splash-load-text">⚡ Synchronizing Duty Lineup...</div>
  </div>

  <!-- Live Duty Board -->
  <iframe 
    id="dutyFrame" 
    src="https://script.google.com/macros/s/AKfycbwd5t7mrO4c3FffIxgVi_XoCBaO6eTbGnhTiHOtDgZpUy8uLk9195KSqIpg1dFGIHPP/exec"
    allow="clipboard-write;">
  </iframe>

  <script>
    // Gives Google Apps Script 2.8 seconds to compile sheet formulas, then reveals the live board
    window.addEventListener('DOMContentLoaded', function() {
      setTimeout(function() {
        const splash = document.getElementById('splashScreen');
        if (splash) {
          splash.style.opacity = '0';
          setTimeout(function() {
            splash.style.display = 'none';
          }, 500);
        }
      }, 2800);
    });
  </script>

</body>
</html>
