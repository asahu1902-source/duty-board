<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Daily Operator Duty Lineup</title>
  
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#07142b">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 8px 6px 30px 6px;
    }

    /* NAVY SPLASH SCREEN WITH ROUNDED LOGO */
    #splashScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #07142b;
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease-out;
    }

    .splash-logo-container {
      position: relative;
      width: 150px;
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 25px;
    }

    .splash-pulse-ring {
      position: absolute;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: 3.5px dashed #facc15;
      animation: spinRing 2.5s linear infinite;
    }

    .splash-app-icon {
      width: 115px;
      height: 115px;
      border-radius: 50%;
      object-fit: cover;
      border: 3.5px solid #ef4444;
      box-shadow: 0 0 35px rgba(239, 68, 68, 0.45);
      z-index: 2;
      background: #07142b;
    }

    .splash-load-text {
      color: #00ffff;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      animation: textPulse 1s ease-in-out infinite alternate;
    }

    @keyframes spinRing {
      100% { transform: rotate(360deg); }
    }

    @keyframes textPulse {
      0%   { opacity: 0.5; transform: scale(0.98); }
      100% { opacity: 1; transform: scale(1.02); text-shadow: 0 0 14px rgba(0, 255, 255, 0.9); }
    }

    /* DUTY BOARD STYLING */
    .board-container {
      width: 100%;
      max-width: 480px;
      border: 3px solid #00ff00;
      background-color: #000000;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .main-title {
      background-color: #ff00ff;
      color: #ffff00;
      font-weight: 900;
      font-size: 16px;
      text-align: center;
      padding: 8px 4px;
      text-transform: uppercase;
    }

    .live-bar {
      background-color: #000000;
      color: #00ffff;
      font-size: 11px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 8px;
    }

    .live-status {
      display: flex;
      align-items: center;
    }

    .live-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background-color: #00ff00;
      border-radius: 50%;
      margin-right: 5px;
      box-shadow: 0 0 6px #00ff00;
    }

    .action-btn-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .refresh-btn {
      background: #000000;
      color: #00ffff;
      border: 1px solid #00ffff;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 900;
      padding: 3px 7px;
      cursor: pointer;
    }

    .whatsapp-btn {
      background: #25D366;
      color: #000000;
      border: 1px solid #25D366;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 900;
      padding: 3px 8px;
      cursor: pointer;
    }

    .date-banner {
      background-color: #ffff00;
      color: #0000cd;
      font-weight: 900;
      font-size: 15px;
      text-align: center;
      padding: 6px 4px;
      border-top: 1px solid #000000;
      border-bottom: 1px solid #000000;
    }

    .master-board-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .master-board-table th {
      background-color: #ff8c00;
      color: #000000;
      font-weight: 900;
      font-size: 11px;
      padding: 6px 2px;
      border: 1px solid #8b0000;
      text-transform: uppercase;
      text-align: center;
    }

    .master-board-table td {
      border: 1px solid #8b0000;
      padding: 5px 2px;
      font-size: 11px;
      font-weight: bold;
      vertical-align: middle;
      text-align: center;
    }

    .cyan-label-cell {
      background-color: #00ffff !important;
      color: #000000 !important;
      font-weight: 900 !important;
      text-align: center !important;
    }

    .name-cell {
      background-color: #000000;
      color: #ffffff;
      text-align: left !important;
      padding-left: 6px !important;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .due-cell {
      background-color: #000000;
      color: #ffff00;
    }

    .date-cell {
      background-color: #000000;
      color: #ffffff;
      font-size: 10px;
      white-space: nowrap;
    }

    .day-cell {
      background-color: #000000;
      color: #38bdf8;
    }

    .shift-cell {
      background-color: #000000;
      color: #00ff00;
      font-weight: 900;
    }

    .summary-val-cell {
      background-color: #000000;
      color: #ffffff;
      text-align: left !important;
      padding-left: 8px !important;
    }

    .summary-center-cell {
      background-color: #000000;
      color: #ffffff;
      text-align: center !important;
    }

    .notice-cell {
      background-color: #8b0000;
      color: #ffff00;
      text-align: center !important;
      font-size: 13px;
      font-weight: 900;
      padding: 8px 4px !important;
    }

    .marquee-container {
      background-color: #000000;
      color: #ffff00;
      font-weight: 900;
      font-size: 12px;
      padding: 6px 0;
      border-top: 1px solid #8b0000;
      overflow: hidden;
      white-space: nowrap;
    }

    .marquee-text {
      display: inline-block;
      animation: marquee 12s linear infinite;
    }

    @keyframes marquee {
      0%   { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }

    .company-holiday-master-header {
      width: 100%;
      max-width: 480px;
      margin-top: 16px;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #b91c1c, #dc2626, #b91c1c);
      color: #ffff00;
      font-size: 13.5px;
      font-weight: 900;
      text-align: center;
      padding: 7px 4px;
      border-radius: 8px;
      border: 1.5px solid #facc15;
      text-transform: uppercase;
      display: none;
    }

    .holiday-cluster-wrapper {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .holiday-single-card {
      border: 2px solid #ff0000;
      border-radius: 10px;
      background-color: #000000;
      padding: 9px 8px;
      box-shadow: 0 0 12px rgba(255, 0, 0, 0.45);
    }

    .holiday-header-strip {
      background: linear-gradient(90deg, #7f1d1d, #991b1b);
      color: #ffffff;
      padding: 7px 10px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 9px;
      border: 1px solid #ef4444;
    }

    .animated-countdown-badge {
      background-color: #facc15;
      color: #000000;
      padding: 5px 12px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 900;
    }

    .relay-cards-grid {
      display: flex;
      justify-content: space-between;
      gap: 6px;
    }

    .relay-single-box {
      flex: 1;
      border: 1.5px solid #ff0000;
      border-radius: 6px;
      background-color: #000000;
      padding: 6px 2px;
      text-align: center;
    }

    .relay-title {
      color: #00ffff;
      font-size: 11px;
      font-weight: 900;
      margin-bottom: 3px;
    }

    .shift-letter-val {
      color: #ffff00;
      font-size: 24px;
      font-weight: 900;
    }
  </style>
</head>
<body>

  <!-- Custom Themed Splash Screen -->
  <div id="splashScreen">
    <div class="splash-logo-container">
      <div class="splash-pulse-ring"></div>
      <img src="icon.png" alt="App Icon" class="splash-app-icon" onerror="this.src='https://asahu1902-source.github.io/duty-board/icon.png'">
    </div>
    <div class="splash-load-text">⚡ Synchronizing Duty Lineup...</div>
  </div>

  <!-- Board Roster Display -->
  <div class="board-container">
    <div class="main-title" id="uiMainTitle">DAILY OPERATOR DUTY LINEUP</div>
    
    <div class="live-bar">
      <div class="live-status">
        <span class="live-dot"></span><span id="uiRefreshed">LIVE</span>
      </div>
      <div class="action-btn-group">
        <button class="whatsapp-btn" onclick="shareToWhatsApp()">💬 WhatsApp</button>
        <button class="refresh-btn" onclick="loadSheetData()">🔄 Refresh</button>
      </div>
    </div>

    <div class="date-banner" id="uiDateBanner">-</div>

    <table class="master-board-table">
      <colgroup>
        <col style="width: 25%;">
        <col style="width: 27%;">
        <col style="width: 10%;">
        <col style="width: 22%;">
        <col style="width: 8%;">
        <col style="width: 8%;">
      </colgroup>
      <thead>
        <tr><th>Position</th><th>Name</th><th>Due</th><th>Last Date</th><th>Day</th><th>Shf</th></tr>
      </thead>
      <tbody id="uiTableBody"></tbody>
    </table>

    <div class="marquee-container">
      <div class="marquee-text">✦ WELCOME RELAY - 3 ✦ HAVE A SAFE AND PRODUCTIVE SHIFT ✦</div>
    </div>
  </div>

  <div id="companyHolidayHeader" class="company-holiday-master-header">🎉 COMPANY NEXT HOLIDAY</div>
  <div class="holiday-cluster-wrapper" id="holidayClusterWrapper"></div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwd5t7mrO4c3FffIxgVi_XoCBaO6eTbGnhTiHOtDgZpUy8uLk9195KSqIpg1dFGIHPP/exec";
    let globalWhatsAppText = "";

    async function loadSheetData() {
      const splash = document.getElementById('splashScreen');
      splash.style.display = 'flex';
      splash.style.opacity = '1';

      try {
        const response = await fetch(SCRIPT_URL + '?t=' + Date.now(), {
          method: 'GET',
          redirect: 'follow'
        });
        const data = await response.json();
        renderBoard(data);
      } catch (err) {
        console.error("Fetch failed", err);
      } finally {
        setTimeout(() => {
          splash.style.opacity = '0';
          setTimeout(() => { splash.style.display = 'none'; }, 400);
        }, 500);
      }
    }

    function renderBoard(data) {
      if (!data) return;

      document.getElementById('uiMainTitle').innerText = data.mainTitle || 'DAILY OPERATOR DUTY LINEUP';
      document.getElementById('uiRefreshed').innerText = 'LIVE | ' + (data.refreshed || '');
      document.getElementById('uiDateBanner').innerText = data.dateBanner || '-';
      globalWhatsAppText = data.whatsappText || '';

      let tbodyHtml = '';
      (data.rows || []).forEach(r => {
        if (r.isNotice) {
          tbodyHtml += `<tr><td colspan="6" class="notice-cell">${r.duty}</td></tr>`;
        } else {
          const parts = (r.duty || "").split("-").map(s => s.trim());
          tbodyHtml += `<tr>
            <td class="cyan-label-cell">${r.pos || ''}</td>
            <td class="name-cell">${parts[0] || '-'}</td>
            <td class="due-cell">${parts[1] || '-'}</td>
            <td class="date-cell">${parts[2] || '-'}</td>
            <td class="day-cell">${parts[3] || '-'}</td>
            <td class="shift-cell">${parts[4] || '-'}</td>
          </tr>`;
        }
      });

      tbodyHtml += `
        <tr><td class="cyan-label-cell">Available</td><td class="summary-center-cell">${data.availableCount || '0'}</td><td colspan="2" class="cyan-label-cell">Stand By</td><td colspan="2" class="summary-center-cell">${data.standBy || '-'}</td></tr>
        <tr><td class="cyan-label-cell">OFF Day</td><td colspan="5" class="summary-val-cell">${data.offDay || 'None'}</td></tr>
        <tr><td class="cyan-label-cell">Leave</td><td colspan="5" class="summary-val-cell">${data.leave || 'None'}</td></tr>
        <tr><td class="cyan-label-cell">Info</td><td colspan="5" class="summary-val-cell">${data.info || '-'}</td></tr>
      `;
      document.getElementById('uiTableBody').innerHTML = tbodyHtml;

      const holHeader = document.getElementById('companyHolidayHeader');
      const holWrapper = document.getElementById('holidayClusterWrapper');

      if (data.holidayCluster && data.holidayCluster.length > 0) {
        holHeader.style.display = 'block';
        let hHtml = '';
        data.holidayCluster.forEach(h => {
          hHtml += `
            <div class="holiday-single-card">
              <div class="holiday-header-strip">
                <div style="font-size:12px; font-weight:900;">🎈 <strong>${h.name}</strong> (${h.date} - ${h.day})</div>
                <div class="animated-countdown-badge">${h.daysToGo}</div>
              </div>
              <div class="relay-cards-grid">
                <div class="relay-single-box"><div class="relay-title">R3 Group</div><div class="shift-letter-val">${h.r3}</div></div>
                <div class="relay-single-box"><div class="relay-title">R2 Group</div><div class="shift-letter-val">${h.r2}</div></div>
                <div class="relay-single-box"><div class="relay-title">R1 Group</div><div class="shift-letter-val">${h.r1}</div></div>
              </div>
            </div>`;
        });
        holWrapper.innerHTML = hHtml;
      } else {
        holHeader.style.display = 'none';
        holWrapper.innerHTML = '';
      }
    }

    function shareToWhatsApp() {
      if (!globalWhatsAppText) return;
      const encoded = encodeURIComponent(globalWhatsAppText);
      if (navigator.share) {
        navigator.share({ text: globalWhatsAppText }).catch(() => {
          window.location.href = "whatsapp://send?text=" + encoded;
        });
      } else {
        window.location.href = "whatsapp://send?text=" + encoded;
      }
    }

    window.onload = loadSheetData;
  </script>
</body>
</html>
