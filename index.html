<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Daily Operator Duty Lineup</title>
  
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#060d1d">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #060d1d;
      overflow: hidden;
    }

    /* ROUNDED ICON SPLASH SCREEN */
    #splashScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #060d1d;
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease-out;
    }

    .splash-logo-container {
      position: relative;
      width: 130px;
      height: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    /* Rotating Neon Border Ring */
    .splash-pulse-ring {
      position: absolute;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 3px dashed #00ffff;
      animation: spin 5s linear infinite;
    }

    /* Rounded App Icon */
    .splash-app-icon {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #facc15;
      box-shadow: 0 0 25px rgba(250, 204, 21, 0.45);
      z-index: 2;
      background: #0b1e42;
    }

    /* Synchronizing Text */
    .splash-load-text {
      color: #00ffff;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      animation: pulseText 1s ease-in-out infinite alternate;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    @keyframes pulseText {
      0% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    /* Live Duty Board Frame */
    #dutyFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background-color: #000000;
    }
  </style>
</head>
<body>

  <!-- App Icon Splash Screen -->
  <div id="splashScreen">
    <div class="splash-logo-container">
      <div class="splash-pulse-ring"></div>
      <img src="icon.png" alt="App Icon" class="splash-app-icon" onerror="this.src='https://asahu1902-source.github.io/duty-board/icon.png'">
    </div>
    <div class="splash-load-text">⚡ Synchronizing Duty Lineup...</div>
  </div>

  <!-- Live Board Frame -->
  <iframe 
    id="dutyFrame" 
    src="https://script.google.com/macros/s/AKfycbwd5t7mrO4c3FffIxgVi_XoCBaO6eTbGnhTiHOtDgZpUy8uLk9195KSqIpg1dFGIHPP/exec"
    allow="clipboard-write;"
    sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts"
    onload="hideSplashScreen()">
  </iframe>

  <script>
    function hideSplashScreen() {
      // Gives the iframe 800ms to visually settle before sliding away
      setTimeout(() => {
        const splash = document.getElementById('splashScreen');
        if (splash) {
          splash.style.opacity = '0';
          setTimeout(() => { splash.style.display = 'none'; }, 500);
        }
      }, 800);
    }
  </script>

</body>
</html>
