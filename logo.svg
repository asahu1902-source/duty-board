<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Solid High-Contrast Dark Blue Background -->
  <rect width="512" height="512" rx="100" fill="#0b1b3d"/>
  
  <!-- Outer Gold Badge Ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#f59e0b" stroke-width="14"/>
  <circle cx="256" cy="256" r="218" fill="#0f2756"/>

  <!-- Bold Red Roof / Base Structure -->
  <path d="M 256 70 L 80 215 L 125 215 L 125 410 L 387 410 L 387 215 L 432 215 Z" fill="none" stroke="#dc2626" stroke-width="22" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 325 125 L 365 125 L 365 175 L 325 142 Z" fill="#dc2626"/>

  <!-- Inner Highlight Accent Frame -->
  <rect x="155" y="215" width="202" height="175" rx="12" fill="#0b1b3d" stroke="#f59e0b" stroke-width="6"/>

  <!-- Bold Gold & Red R3 Typography -->
  <!-- Bold "R" -->
  <text x="180" y="345" font-family="Arial Black, Impact, sans-serif" font-size="130" font-weight="900" fill="#ef4444" stroke="#ffffff" stroke-width="3" text-anchor="middle">R</text>
  <!-- Bold "3" -->
  <text x="315" y="345" font-family="Arial Black, Impact, sans-serif" font-size="130" font-weight="900" fill="#f59e0b" stroke="#ffffff" stroke-width="3" text-anchor="middle">3</text>
  
  <!-- Bottom Banner Label -->
  <rect x="136" y="420" width="240" height="42" rx="21" fill="#dc2626"/>
  <text x="256" y="448" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="3">DUTY LINEUP</text>
</svg>
